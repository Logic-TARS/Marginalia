version: "3.8"

services:
  api:
    build: ./backend
    ports:
      - "8720:8720"
    volumes:
      - ./backend:/app          # Hot reload in dev
      - marginalia_data:/app/data
    env_file:
      - .env
    environment:
      # Reuse the Windows-native Ollama service from inside the container.
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn main:app --host 0.0.0.0 --port 8720 --reload

volumes:
  marginalia_data:
